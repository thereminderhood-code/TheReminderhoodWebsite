<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-label="A mosque at dusk under a crescent moon">
  <defs>
    <radialGradient id="sun" cx="0.56" cy="0.68" r="0.55">
      <stop offset="0" stop-color="#F16001" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#E85002" stop-opacity=".6"/>
      <stop offset=".6" stop-color="#C10801" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c100a"/>
      <stop offset="1" stop-color="#070403"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F16001" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F16001" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F16001" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e0c04"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD29A"/>
      <stop offset=".4" stop-color="#F16001" stop-opacity=".6"/>
      <stop offset="1" stop-color="#F16001" stop-opacity="0"/>
    </radialGradient>
    <mask id="moonCut">
      <rect width="900" height="720" fill="#fff"/>
      <circle cx="402" cy="128" r="44" fill="#000"/>
    </mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="900" height="720" fill="url(#sun)"/>

  <!-- crescent -->
  <g mask="url(#moonCut)">
    <circle cx="380" cy="146" r="46" fill="#FFC48A" filter="url(#soft)" opacity=".55"/>
    <circle cx="380" cy="146" r="46" fill="#FFE2BF"/>
  </g>

  <!-- distant trees -->
  <g fill="#120905">
    <circle cx="60" cy="520" r="70"/><circle cx="130" cy="500" r="60"/><circle cx="190" cy="530" r="50"/>
    <circle cx="830" cy="470" r="80"/><circle cx="880" cy="510" r="70"/><circle cx="770" cy="520" r="55"/>
  </g>

  <!-- mosque -->
  <g fill="url(#sil)">
    <!-- minarets -->
    <rect x="262" y="250" width="26" height="290"/>
    <rect x="256" y="300" width="38" height="10"/><rect x="256" y="380" width="38" height="10"/>
    <path d="M262 250 L275 196 L288 250Z"/><rect x="273" y="180" width="4" height="18"/>
    <rect x="712" y="230" width="28" height="310"/>
    <rect x="705" y="280" width="42" height="10"/><rect x="705" y="370" width="42" height="10"/>
    <path d="M712 230 L726 170 L740 230Z"/><rect x="724" y="152" width="4" height="20"/>
    <!-- side domes -->
    <path d="M318 430 C318 388 352 372 368 356 C384 372 418 388 418 430Z"/><rect x="366" y="338" width="4" height="20"/>
    <path d="M582 430 C582 388 616 372 632 356 C648 372 682 388 682 430Z"/><rect x="630" y="338" width="4" height="20"/>
    <!-- main drum + dome -->
    <rect x="390" y="380" width="220" height="60"/>
    <path d="M396 384 C390 300 470 270 500 236 C530 270 610 300 604 384Z"/>
    <rect x="497" y="206" width="6" height="32"/>
    <path d="M500 196 a8 8 0 1 0 0.1 0Z"/>
    <!-- body -->
    <rect x="300" y="430" width="400" height="110"/>
  </g>

  <!-- rim light on the dome -->
  <path d="M396 384 C390 300 470 270 500 236 C530 270 610 300 604 384" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- lit arches -->
  <g fill="#FFB067">
    <path d="M330 540 V478 a14 14 0 0 1 28 0 V540Z" opacity=".55"/>
    <path d="M378 540 V472 a16 16 0 0 1 32 0 V540Z" opacity=".75"/>
    <path d="M478 540 V462 a22 22 0 0 1 44 0 V540Z" opacity=".95"/>
    <path d="M590 540 V472 a16 16 0 0 1 32 0 V540Z" opacity=".75"/>
    <path d="M642 540 V478 a14 14 0 0 1 28 0 V540Z" opacity=".55"/>
    <path d="M430 425 V404 a8 8 0 0 1 16 0 V425Z" opacity=".6"/>
    <path d="M492 425 V400 a8 8 0 0 1 16 0 V425Z" opacity=".7"/>
    <path d="M554 425 V404 a8 8 0 0 1 16 0 V425Z" opacity=".6"/>
  </g>

  <!-- water + reflection -->
  <rect y="540" width="900" height="180" fill="url(#water)"/>
  <g fill="#F16001" opacity=".35">
    <rect x="470" y="556" width="60" height="3" rx="1.5"/><rect x="440" y="572" width="120" height="3" rx="1.5"/>
    <rect x="480" y="590" width="40" height="2" rx="1"/><rect x="400" y="606" width="200" height="2" rx="1" opacity=".6"/>
    <rect x="360" y="626" width="80" height="2" rx="1" opacity=".5"/><rect x="560" y="640" width="90" height="2" rx="1" opacity=".5"/>
  </g>

  <!-- lantern on a plinth -->
  <rect x="690" y="630" width="210" height="90" fill="#0a0604"/>
  <circle cx="790" cy="560" r="90" fill="url(#lamp)"/>
  <g fill="#120905">
    <path d="M770 512 h40 l-6 -14 h-28Z"/><rect x="787" y="486" width="6" height="14"/>
    <path d="M766 512 h48 v8 h-48Z"/><path d="M766 600 h48 v10 h-48Z"/>
    <path d="M760 610 h60 v20 h-60Z"/>
  </g>
  <g fill="#FFC98A" opacity=".9">
    <path d="M772 520 h36 v80 h-36Z"/>
  </g>
  <g stroke="#3a1f0e" stroke-width="3" fill="none">
    <path d="M790 520 v80 M772 548 h36 M772 574 h36"/>
    <path d="M776 520 c6 14 22 14 28 0 M776 600 c6 -14 22 -14 28 0"/>
  </g>
</svg>
